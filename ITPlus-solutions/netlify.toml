[build]
  command = """
  echo "const EMAILJS_CONFIG = {" > config.js
  echo "  publicKey: '$EMAILJS_PUBLIC_KEY'," >> config.js
  echo "  serviceID: '$EMAILJS_SERVICE_ID'," >> config.js
  echo "  adminTemplateID: '$EMAILJS_ADMIN_TEMPLATE'," >> config.js
  echo "  autoReplyTemplateID: '$EMAILJS_AUTO_REPLY_TEMPLATE'" >> config.js
  echo "};" >> config.js
  """
  publish = "."